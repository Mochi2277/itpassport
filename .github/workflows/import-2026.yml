name: Import IPA 2026 public exam questions
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/import_2026_web.py'
      - '.github/workflows/import-2026.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser
        run: pip install 'beautifulsoup4>=4.12,<5' 'requests>=2.32,<3'
      - name: Import R08 with official IPA answer verification
        run: python scripts/import_2026_web.py
      - name: Commit verified exam dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add questions_2026.js data/2026-import-report.json assets/questions/2026/
          if ! git diff --cached --quiet; then
            git commit -m "Import 2026 IT Passport IPA verified 100 questions"
            git push origin HEAD:main
          fi
