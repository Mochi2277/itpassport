name: Import IPA 2024 public exam questions
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/import_2024.py'
      - '.github/workflows/import-2024.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF reader
        run: pip install 'beautifulsoup4>=4.12,<5' 'requests>=2.32,<3'
      - name: Import IPA problem transcription and verify all 100 official answer keys
        run: python scripts/import_2024_web.py
      - name: Commit imported questions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add questions_2024.js data/2024-import-report.json
          if ! git diff --cached --quiet; then
            git commit -m "Import 100 IPA 2024 questions (transcription; IPA answer-verified)"
            git push origin HEAD:main
          fi
