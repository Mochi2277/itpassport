name: Import IPA 2024 public exam questions
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/import_2024.py'
      - '.github/workflows/import-2024.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF reader
        run: pip install 'pymupdf>=1.24,<2' 'requests>=2.32,<3'
      - name: Inspect fallback source structure
        run: |
          python - <<'PY'
          import requests, re
          from html.parser import HTMLParser
          u='https://e-words.jp/p/e-ip-past-R06.html'
          r=requests.get(u,timeout=50)
          print('FALLBACK_HTTP',r.status_code,'SIZE',len(r.content),'CTYPE',r.headers.get('Content-Type'))
          for needle in ['問1','問 1','マーケティングオートメーション']:
            i=r.text.find(needle)
            print('NEEDLE',needle,i,repr(r.text[max(i-300,0):i+550]))
          PY
      - name: Read official IPA PDFs and generate validated question data
        run: python scripts/import_2024.py
      - name: Commit imported questions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add questions_2024.js data/2024-import-report.json assets/questions/2024/
          if ! git diff --cached --quiet; then
            git commit -m "Import 100 IPA 2024 questions from official PDF (automatic extraction)"
            git push origin HEAD:main
          fi
