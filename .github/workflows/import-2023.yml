name: Import IPA 2023 public exam questions
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/import_2023_web.py'
      - '.github/workflows/import-2023.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install HTML parser
        run: pip install 'beautifulsoup4>=4.12,<5' 'requests>=2.32,<3'
      - name: Extract and validate 100 public questions
        run: python scripts/import_2023_web.py
      - name: Commit imported dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add questions_2023.js data/2023-import-report.json assets/questions/2023/
          if ! git diff --cached --quiet; then
            git commit -m "Import 100 public IT Passport 2023 questions"
            git push origin HEAD:main
          fi
