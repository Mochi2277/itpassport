name: Audit 700 question content quality risks
on:
  workflow_dispatch:
  push:
    paths:
      - 'questions*.js'
      - 'scripts/audit_content_quality.py'
      - '.github/workflows/content-quality-audit.yml'
permissions:
  contents: write
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/audit_content_quality.py
      - name: Commit inventory report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/content-quality-inventory.json
          if ! git diff --cached --quiet; then
            git commit -m "Record 700-question content quality risk inventory"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
