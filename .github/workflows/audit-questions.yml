name: Audit all IT Passport question sets
on:
  workflow_dispatch:
  push:
    paths:
      - 'questions*.js'
      - 'scripts/audit_questions.py'
      - '.github/workflows/audit-questions.yml'
      - 'assets/questions/**'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check seven years, official keys and illustration assets
        run: python scripts/audit_questions.py
